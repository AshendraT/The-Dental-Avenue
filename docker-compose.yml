version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dental_avenue_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dental_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dental_avenue_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/dental_avenue
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=24h
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - dental_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dental_avenue_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - dental_network

volumes:
  mongo_data:

networks:
  dental_network:
    driver: bridge
